<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Detail — Samuel Adisi</title>
  <link rel="shortcut icon" href="./assets/images/logo.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/style.css">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    a { text-decoration: none; }
    li { list-style: none; }

    :root {
      --smoky-black: hsl(0, 0%, 7%);
      --eerie-black-1: hsl(240, 2%, 13%);
      --eerie-black-2: hsl(240, 2%, 12%);
      --jet: hsl(0, 0%, 22%);
      --onyx: hsl(240, 1%, 17%);
      --white-1: hsl(0, 0%, 100%);
      --white-2: hsl(0, 0%, 98%);
      --light-gray: hsl(0, 0%, 84%);
      --light-gray-70: hsla(0, 0%, 84%, 0.7);
      --orange-yellow: hsl(45, 100%, 72%);
      --vegas-gold: hsl(45, 54%, 58%);
      --ff: 'Poppins', sans-serif;
      --shadow-1: -4px 8px 24px hsla(0,0%,0%,0.25);
      --shadow-2: 0 16px 30px hsla(0,0%,0%,0.25);
      --bg-gradient-onyx: linear-gradient(to bottom right, hsl(240,1%,25%) 3%, hsl(0,0%,19%) 97%);
      --bg-gradient-jet: linear-gradient(to bottom right, hsla(240,1%,18%,0.251) 0%, hsla(240,2%,11%,0) 100%), hsl(240,2%,13%);
      --bg-gradient-yellow-1: linear-gradient(to bottom right, hsl(45,100%,71%) 0%, hsla(36,100%,69%,0) 50%);
      --bg-gradient-yellow-2: linear-gradient(135deg, hsla(45,100%,71%,0.251) 0%, hsla(35,100%,68%,0) 59.86%), hsl(240,2%,13%);
      --border-gradient-onyx: linear-gradient(to bottom right, hsl(0,0%,25%) 0%, hsla(0,0%,25%,0) 50%);
      --text-gradient-yellow: linear-gradient(to right, hsl(45,100%,72%), hsl(35,100%,68%));
      --transition-1: 0.25s ease;
      --transition-2: 0.5s ease-in-out;
    }

    body {
      font-family: var(--ff);
      background: var(--smoky-black);
      color: var(--white-2);
      min-height: 100vh;
    }

    /* ======= LAYOUT ======= */
    .detail-main {
      margin: 15px 12px;
      margin-bottom: 75px;
      min-width: 259px;
    }

    /* ======= SIDEBAR (reuse from main) ======= */
    .sidebar {
      background: var(--eerie-black-2);
      border: 1px solid var(--jet);
      border-radius: 20px;
      padding: 15px;
      box-shadow: var(--shadow-1);
      margin-bottom: 15px;
      max-height: 112px;
      overflow: hidden;
      transition: var(--transition-2);
      z-index: 1;
    }
    .sidebar.active { max-height: 405px; }

    .sidebar-info {
      position: relative;
      display: flex;
      justify-content: flex-start;
      align-items: center;
      gap: 15px;
    }
    .avatar-box {
      background: var(--bg-gradient-onyx);
      border-radius: 20px;
      flex-shrink: 0;
    }
    .avatar-box img { display: block; }
    .info-content .name {
      color: var(--white-2);
      font-size: 17px;
      font-weight: 500;
      letter-spacing: -0.25px;
      margin-bottom: 10px;
    }
    .info-content .title {
      color: var(--white-1);
      background: var(--onyx);
      font-size: 11px;
      font-weight: 300;
      width: max-content;
      padding: 3px 12px;
      border-radius: 8px;
    }
    .info_more-btn {
      position: absolute;
      top: -15px;
      right: -15px;
      border-radius: 0 15px;
      font-size: 13px;
      color: var(--orange-yellow);
      background: var(--border-gradient-onyx);
      padding: 10px;
      box-shadow: var(--shadow-2);
      transition: var(--transition-1);
      z-index: 1;
      border: none;
      cursor: pointer;
    }
    .info_more-btn::before {
      content: "";
      position: absolute;
      inset: 1px;
      border-radius: inherit;
      background: var(--bg-gradient-jet);
      transition: var(--transition-1);
      z-index: -1;
    }
    .info_more-btn:hover, .info_more-btn:focus { background: var(--bg-gradient-yellow-1); }
    .info_more-btn:hover::before, .info_more-btn:focus::before { background: var(--bg-gradient-yellow-2); }
    .info_more-btn span { display: none; }

    .sidebar-info_more {
      opacity: 0;
      visibility: hidden;
      transition: var(--transition-2);
    }
    .sidebar.active .sidebar-info_more { opacity: 1; visibility: visible; }

    .separator {
      width: 100%;
      height: 1px;
      background: var(--jet);
      margin: 16px 0;
    }
    .contacts-list {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }
    .contact-item {
      min-width: 100%;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .icon-box {
      position: relative;
      background: var(--border-gradient-onyx);
      width: 30px;
      height: 30px;
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 16px;
      color: var(--orange-yellow);
      box-shadow: var(--shadow-1);
      z-index: 1;
      flex-shrink: 0;
    }
    .icon-box::before {
      content: "";
      position: absolute;
      inset: 1px;
      background: var(--eerie-black-1);
      border-radius: inherit;
      z-index: -1;
    }
    .contact-info { max-width: calc(100% - 46px); width: calc(100% - 46px); }
    .contact-title {
      color: hsla(0,0%,84%,0.7);
      font-size: 11px;
      text-transform: uppercase;
      margin-bottom: 2px;
    }
    .contact-info .contact-link, .contact-info address {
      color: var(--white-2);
      font-size: 13px;
      font-style: normal;
    }
    .social-list {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      gap: 15px;
      padding-bottom: 4px;
      padding-left: 7px;
    }
    .social-item .social-link {
      color: hsla(0,0%,84%,0.7);
      font-size: 18px;
      display: block;
    }
    .social-item .social-link:hover { color: var(--light-gray); }

    /* ======= NAVBAR ======= */
    .navbar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: hsla(240,1%,17%,0.75);
      backdrop-filter: blur(10px);
      border: 1px solid var(--jet);
      border-radius: 12px 12px 0 0;
      box-shadow: var(--shadow-2);
      z-index: 5;
    }
    .navbar-list {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      padding: 0 10px;
    }
    .navbar-link {
      color: var(--light-gray);
      font-size: 11px;
      padding: 20px 7px;
      transition: color var(--transition-1);
      background: none;
      border: none;
      font-family: var(--ff);
      cursor: pointer;
    }
    .navbar-link:hover { color: hsla(0,0%,84%,0.7); }
    .navbar-link.active { color: var(--orange-yellow); }

    /* ======= MAIN CONTENT AREA ======= */
    .detail-content {
      background: var(--eerie-black-2);
      border: 1px solid var(--jet);
      border-radius: 20px;
      padding: 20px;
      box-shadow: var(--shadow-1);
    }

    /* ======= BACK BTN ======= */
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--light-gray);
      font-size: 13px;
      font-weight: 500;
      padding: 8px 14px;
      border-radius: 10px;
      border: 1px solid var(--jet);
      background: var(--onyx);
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
      margin-bottom: 24px;
      font-family: var(--ff);
    }
    .back-btn:hover { border-color: var(--orange-yellow); color: var(--orange-yellow); }
    .back-btn svg { width: 15px; height: 15px; }

    /* ======= PROJECT DETAIL STYLES ======= */
    .project-hero { margin-bottom: 28px; }

    .project-hero-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .detail-title {
      font-size: clamp(1.3rem, 4vw, 2rem);
      font-weight: 600;
      color: var(--white-2);
      line-height: 1.2;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: hsla(142,70%,45%,0.15);
      color: hsl(142,70%,55%);
      border: 1px solid hsla(142,70%,45%,0.3);
      font-size: 11px;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 20px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .status-badge.wip {
      background: hsla(45,100%,60%,0.12);
      color: hsl(45,100%,72%);
      border-color: hsla(45,100%,60%,0.3);
    }
    .status-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: currentColor;
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

    .detail-desc {
      color: var(--light-gray);
      font-size: 14px;
      font-weight: 300;
      line-height: 1.75;
      margin-bottom: 18px;
    }

    .detail-meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 20px;
    }
    .meta-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--light-gray-70);
      font-size: 12px;
    }
    .meta-chip svg { width: 14px; height: 14px; flex-shrink: 0; }

    .detail-actions { display: flex; flex-wrap: wrap; gap: 10px; }

    .btn-live {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: var(--orange-yellow);
      color: hsl(0,0%,7%);
      font-size: 13px;
      font-weight: 600;
      padding: 10px 20px;
      border-radius: 12px;
      transition: opacity 0.2s, transform 0.2s;
      font-family: var(--ff);
    }
    .btn-live:hover { opacity: 0.88; transform: scale(0.98); }
    .btn-live svg { width: 15px; height: 15px; }

    .btn-source {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: var(--onyx);
      color: var(--light-gray);
      font-size: 13px;
      font-weight: 500;
      padding: 10px 20px;
      border-radius: 12px;
      border: 1px solid var(--jet);
      transition: border-color 0.2s, color 0.2s;
      font-family: var(--ff);
    }
    .btn-source:hover { border-color: var(--orange-yellow); color: var(--orange-yellow); }
    .btn-source svg { width: 15px; height: 15px; }

    /* ======= SECTIONS ======= */
    .section { margin-bottom: 28px; }

    .section-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--white-2);
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--jet);
    }

    .gallery-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
    @media(min-width: 500px) {
      .gallery-grid { grid-template-columns: 1fr 1fr; }
      .gallery-grid .gallery-main { grid-column: 1 / -1; }
    }

    .gallery-img {
      width: 100%;
      border-radius: 12px;
      border: 1px solid var(--jet);
      object-fit: cover;
      display: block;
      cursor: pointer;
      transition: transform 0.25s, border-color 0.25s;
    }
    .gallery-img:hover { transform: scale(1.02); border-color: var(--orange-yellow); }

    .about-box {
      background: var(--onyx);
      border: 1px solid var(--jet);
      border-radius: 14px;
      padding: 20px;
      color: var(--light-gray);
      font-size: 13px;
      font-weight: 300;
      line-height: 1.8;
    }

    .info-grid { display: grid; grid-template-columns: 1fr; gap: 14px; }
    @media(min-width: 500px) { .info-grid { grid-template-columns: 1fr 1fr; } }

    .info-card {
      background: var(--onyx);
      border: 1px solid var(--jet);
      border-radius: 14px;
      padding: 18px;
    }
    .info-card-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .info-card-icon {
      width: 36px; height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .icon-blue  { background: hsla(210,100%,60%,0.12); color: hsl(210,100%,65%); }
    .icon-yellow{ background: hsla(45,100%,60%,0.12);  color: var(--orange-yellow); }
    .icon-red   { background: hsla(0,70%,60%,0.12);    color: hsl(0,70%,65%); }
    .icon-green { background: hsla(142,70%,45%,0.12);  color: hsl(142,70%,55%); }
    .info-card-icon svg { width: 18px; height: 18px; }
    .info-card-title { font-size: 14px; font-weight: 600; color: var(--white-2); }

    .tech-tags { display: flex; flex-wrap: wrap; gap: 7px; }
    .tech-tag {
      background: var(--eerie-black-2);
      color: var(--light-gray);
      font-size: 11px;
      font-weight: 500;
      padding: 4px 12px;
      border-radius: 20px;
      border: 1px solid var(--jet);
    }

    .feature-list, .challenge-list { display: flex; flex-direction: column; gap: 9px; }
    .feature-item {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      color: var(--light-gray);
      font-size: 12px;
      font-weight: 300;
      line-height: 1.5;
    }
    .feature-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--orange-yellow);
      flex-shrink: 0;
      margin-top: 5px;
    }
    .challenge-item {
      font-size: 12px;
      color: var(--light-gray);
      font-weight: 300;
      line-height: 1.6;
      padding-bottom: 9px;
      border-bottom: 1px solid var(--jet);
    }
    .challenge-item:last-child { border-bottom: none; padding-bottom: 0; }
    .challenge-label { font-weight: 600; color: var(--white-2); font-size: 12px; }

    /* ======= NOT FOUND ======= */
    .not-found { text-align: center; padding: 60px 20px; color: var(--light-gray); }
    .not-found h2 { font-size: 22px; margin-bottom: 10px; color: var(--white-2); }

    /* ======= LIGHTBOX ======= */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: hsla(0,0%,0%,0.92);
      z-index: 999;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .lightbox.open { display: flex; }
    .lightbox img { max-width: 95vw; max-height: 90vh; border-radius: 12px; object-fit: contain; }
    .lightbox-close {
      position: absolute;
      top: 20px; right: 20px;
      background: var(--onyx);
      border: 1px solid var(--jet);
      color: var(--white-2);
      width: 38px; height: 38px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 18px;
      transition: border-color 0.2s;
    }
    .lightbox-close:hover { border-color: var(--orange-yellow); }

    /* ======= RESPONSIVE: 580px ======= */
    @media (min-width: 580px) {
      .detail-main { margin-top: 60px; margin-bottom: 100px; }
      .sidebar {
        width: 520px;
        margin-inline: auto;
        padding: 30px;
        max-height: 180px;
        margin-bottom: 30px;
      }
      .sidebar.active { max-height: 584px; }
      .sidebar-info { gap: 25px; }
      .avatar-box { border-radius: 30px; }
      .avatar-box img { width: 120px; }
      .info-content .name { margin-bottom: 15px; }
      .info-content .title { padding: 5px 18px; }
      .info_more-btn { top: -30px; right: -30px; padding: 10px 15px; }
      .info_more-btn span { display: block; font-size: 12px; }
      .info_more-btn ion-icon { display: none; }
      .separator { margin: 32px 0; }
      .contacts-list { gap: 20px; }
      .navbar { border-radius: 20px 20px 0 0; }
      .navbar-list { gap: 20px; }
      .navbar-link { font-size: 14px; }
      .detail-content { width: 520px; margin-inline: auto; padding: 30px; }
    }

    /* ======= RESPONSIVE: 768px ======= */
    @media (min-width: 768px) {
      .sidebar, .detail-content { width: 700px; }
      .contacts-list { grid-template-columns: 1fr 1fr; gap: 30px 15px; }
      .navbar-link { font-size: 15px; }
    }

    /* ======= RESPONSIVE: 1024px ======= */
    @media (min-width: 1024px) {
      .sidebar, .detail-content { width: 950px; box-shadow: 0 24px 80px hsla(0,0%,0%,0.25); }
      .detail-main { margin-bottom: 60px; }
      .navbar {
        position: absolute;
        bottom: auto; top: 0;
        left: auto; right: 0;
        width: max-content;
        border-radius: 0 20px;
        padding: 0 20px;
        box-shadow: none;
      }
      .navbar-list { gap: 30px; padding: 0 20px; }
      .navbar-link { font-weight: 500; }
      .detail-main-inner {
        position: relative;
        width: max-content;
        margin: auto;
      }
    }

    /* ======= RESPONSIVE: 1250px ======= */
    @media (min-width: 1250px) {
      .detail-main {
        max-width: 1200px;
        margin-inline: auto;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        gap: 25px;
      }
      .sidebar {
        width: auto;
        position: sticky;
        top: 60px;
        max-height: max-content !important;
        height: max-content;
        margin-bottom: 0;
        padding-top: 60px;
        flex-shrink: 0;
        min-width: 260px;
      }
      .sidebar-info { flex-direction: column; }
      .avatar-box img { width: 150px; }
      .info-content .name { white-space: nowrap; text-align: center; }
      .info-content .title { margin: auto; }
      .info_more-btn { display: none; }
      .sidebar-info_more { opacity: 1 !important; visibility: visible !important; }
      .contacts-list { grid-template-columns: 1fr; }
      .social-list { justify-content: center; }
      .detail-content-wrap { flex: 1; min-width: 0; }
      .detail-content { width: auto; }
      .detail-main-inner { width: 100%; margin: 0; }
    }
  </style>
</head>
<body>

  <!-- LIGHTBOX -->
  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lightboxClose">✕</button>
    <img id="lightboxImg" src="" alt="">
  </div>

  <main class="detail-main">

    <!-- ======= SIDEBAR ======= -->
    <aside class="sidebar" data-sidebar>
      <div class="sidebar-info">
        <figure class="avatar-box">
          <img src="./assets/images/my-avatar.png" alt="Samuel Adisi" width="80">
        </figure>
        <div class="info-content">
          <h1 class="name">Samuel Adisi</h1>
          <p class="title">Software Engineer & ML/AI Engineer</p>
        </div>
        <button class="info_more-btn" data-sidebar-btn>
          <span>Show Contacts</span>
          <ion-icon name="chevron-down"></ion-icon>
        </button>
      </div>

      <div class="sidebar-info_more">
        <div class="separator"></div>
        <ul class="contacts-list">
          <li class="contact-item">
            <div class="icon-box"><ion-icon name="mail-outline"></ion-icon></div>
            <div class="contact-info">
              <p class="contact-title">Email</p>
              <a href="mailto:samueladisi555@gmail.com" class="contact-link">samueladisi555@gmail.com</a>
            </div>
          </li>
          <li class="contact-item">
            <div class="icon-box"><ion-icon name="phone-portrait-outline"></ion-icon></div>
            <div class="contact-info">
              <p class="contact-title">Phone</p>
              <a href="tel:+233537872807" class="contact-link">+233537872807</a>
            </div>
          </li>
          <li class="contact-item">
            <div class="icon-box"><ion-icon name="location-outline"></ion-icon></div>
            <div class="contact-info">
              <p class="contact-title">Location</p>
              <address>Accra, Ghana</address>
            </div>
          </li>
        </ul>
        <div class="separator"></div>
        <ul class="social-list">
          <li class="social-item">
            <a href="#" class="social-link"><ion-icon name="logo-facebook"></ion-icon></a>
          </li>
          <li class="social-item">
            <a href="#" class="social-link"><ion-icon name="logo-twitter"></ion-icon></a>
          </li>
          <li class="social-item">
            <a href="#" class="social-link"><ion-icon name="logo-instagram"></ion-icon></a>
          </li>
        </ul>
      </div>
    </aside>

    <!-- ======= MAIN CONTENT ======= -->
    <div class="detail-content-wrap">

      <!-- NAVBAR -->
      <nav class="navbar">
        <ul class="navbar-list">
          <li class="navbar-item">
            <a href="./index.html" class="navbar-link">About</a>
          </li>
          <li class="navbar-item">
            <a href="./index.html#resume" class="navbar-link">Resume</a>
          </li>
          <li class="navbar-item">
            <a href="./index.html#portfolio" class="navbar-link active">Portfolio</a>
          </li>
          <li class="navbar-item">
            <a href="./index.html#blog" class="navbar-link">Blog</a>
          </li>
          <li class="navbar-item">
            <a href="./index.html#contact" class="navbar-link">Contact</a>
          </li>
        </ul>
      </nav>

      <!-- PROJECT DETAIL CARD -->
      <div class="detail-content">

        <button class="back-btn" onclick="history.back()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"/>
          </svg>
          Back to Projects
        </button>

        <div id="notFound" class="not-found" style="display:none;">
          <h2>Project not found</h2>
          <p>This project doesn't exist or hasn't been added yet.</p>
        </div>

        <div id="pageWrap"></div>

      </div>

  </main>
